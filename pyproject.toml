[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tinylm"
version = "0.1.0"
description = "A small language model built from scratch, one component per week (Generative AI from First Principles)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Madhusudhan Reddy Pittu"}]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["matplotlib", "scikit-learn", "pytest", "jupyterlab", "nbformat", "nbconvert", "ipykernel"]
torch = ["torch>=2.1"]

[tool.setuptools]
packages = ["tinylm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
